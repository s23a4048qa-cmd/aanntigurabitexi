<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ガソリンスタンド 案内ゲーム</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1>⛽ ガソリンスタンド案内ゲーム</h1>
            <p>入店してくる車の給油口を当てて、正しいレーンに案内しよう！</p>
            <p class="rules">
                給油口が左なら「左へ案内」<br>
                給油口が右なら「右へ案内」
            </p>
            <div class="difficulty-buttons">
                <button id="start-btn" class="difficulty-btn easy">業務開始（スタート）</button>
            </div>
        </div>

        <!-- Play Screen -->
        <div id="play-screen" class="screen">
            <div class="header-info">
                <div class="score-board">売上: <span id="score">0</span>円</div>
                <div class="time-board">残り時間: <span id="time">30</span>秒</div>
            </div>
            
            <div class="game-area">
                <div id="car-info">
                    <h2 id="car-name">車名</h2>
                </div>
                <div class="car-image-container">
                    <img id="car-image" src="" alt="車の画像" />
                    <div id="feedback-overlay" class="feedback-overlay"></div>
                </div>
                
                <div class="controls">
                    <button id="btn-left" class="action-btn">👈 左へ案内<br><small>(給油口: 左)</small></button>
                    <button id="btn-right" class="action-btn">右へ案内 👉<br><small>(給油口: 右)</small></button>
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <h2>業務終了！</h2>
            <div class="result-layout">
                <div class="result-main">
                    <div class="result-details">
                        <p>最終売上: <span id="final-score" class="highlight"></span> 円</p>
                        <p>あなたの称号: <span id="title" class="highlight"></span></p>
                    </div>
                    
                    <div class="difficulty-buttons">
                        <button id="retry-btn">もう一度プレイ</button>
                    </div>
                </div>
                
                <div class="ranking-container">
                    <h3>🏆 売上ランキング トップ5</h3>
                    <ol id="ranking-list" class="ranking-list">
                        <!-- ランキングがここに入る -->
                    </ol>
                </div>
            </div>
        </div>
    </div>

    <script src="cars.js"></script>
    <script src="app.js"></script>
</body>
</html>
